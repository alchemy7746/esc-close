name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build universal app
        run: make build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EscClose-macOS-universal
          path: dist/EscClose-*.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/EscClose-*.zip --generate-notes
